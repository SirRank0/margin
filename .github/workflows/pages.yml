name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  schedule:
    # Daily refresh of match stats and shop items, 11:00 UTC (5 AM Central in winter)
    - cron: "0 11 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      # Merges deploy fast with the data already saved in the repo.
      # The daily run (or a manual run) downloads fresh data and saves it back.
      - name: Download fresh data
        if: github.event_name != 'push'
        run: |
          python3 scripts/fetch-rank-slices.py
          python3 scripts/fetch-ability-orders.py
          python3 scripts/build_shop_items.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:pages
      - name: Save fresh data to the repo
        if: github.event_name != 'push'
        run: |
          git config user.name "SirRank0"
          git config user.email "sirrank0@users.noreply.github.com"
          git add src/data/margin-ranks.ts src/data/ability-orders.ts src/data/shop-items.ts public/ability-orders
          git diff --cached --quiet || (git commit -m "Daily data refresh" && git push)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
